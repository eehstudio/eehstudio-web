<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EEH STUDIO · 공간 다이어그램</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae2;color:#242421;font:12px system-ui,sans-serif}canvas{display:block;width:100%;height:100%}#stage{position:absolute;inset:0 0 48px}nav{overflow-x:auto;white-space:nowrap;position:absolute;bottom:0;height:48px;left:0;right:0;padding:8px 12px;display:flex;gap:8px;align-items:center;border-top:1px solid #ccc9c1;background:#f6f3ec}button{border:1px solid #bdb9af;background:transparent;color:inherit;padding:6px 10px;cursor:pointer;border-radius:2px}button[aria-pressed=true]{background:#222;color:#fff}small{margin-left:auto;font-size:10px}#status{position:absolute;top:14px;left:14px;background:#f6f3ecd9;padding:8px;max-width:80%;pointer-events:none}#labels{position:absolute;inset:0;pointer-events:none}.pin{position:absolute;transform:translate(-50%,-50%);padding:6px 9px;border-radius:30px;background:#f6f3ec;pointer-events:auto;white-space:nowrap;font-size:11px}.pin.on{background:#e95b3e;color:white;border-color:#e95b3e}@media(max-width:500px){small{display:none}.pin{font-size:10px;padding:5px 7px}}</style></head><body><div id="stage"><canvas id="canvas" aria-label="드래그로 회전하는 공간 구조 다이어그램"></canvas><div id="labels"></div></div><div id="status" role="status">도면을 불러오는 중…</div><nav><button data-view="iso" aria-pressed="true">아이소</button><button data-view="front" aria-pressed="false">정면</button><button data-view="right" aria-pressed="false">측면</button><button data-view="top" aria-pressed="false">탑뷰</button><button id="reset">시점 초기화</button><small>드래그 회전 · 확대</small></nav><script type="module" src="viewer.js"></script></body></html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EEH STUDIO · Model views</title><link rel="stylesheet" href="viewer.css"></head>
<body>
<header><div><span>EEH STUDIO / MODEL VIEWS</span><h1 id="title">공간 구조 모델</h1></div><a id="download" hidden download>GLB ↓</a></header>
<nav aria-label="3D 시점 선택"><button data-view="iso" aria-pressed="true">아이소</button><button data-view="plan" aria-pressed="false">평면</button><button data-view="front" aria-pressed="false">정면</button><button data-view="left" aria-pressed="false">좌측</button><button data-view="right" aria-pressed="false">우측</button><span class="divider"></span><label>표현 <select id="material"><option value="material">재질 + 구조선</option><option value="white">백색 모형</option><option value="line">선 도면</option></select></label><label class="cutaway" hidden><input type="checkbox" id="cutaway">상부 프레임 숨기기</label></nav>
<main id="stage"><canvas id="canvas" tabindex="0" aria-label="공간 3D 모델. 마우스 또는 한 손가락 드래그로 회전, 휠 또는 두 손가락으로 확대합니다."></canvas><div id="status" role="status">구조 모델을 불러오는 중…</div><div id="view-name">AXONOMETRIC</div><button id="reset" title="모델 전체를 화면에 맞추기">전체 맞춤 ↗</button></main>
<footer><p id="note"></p><div><span id="dimension"></span><span>드래그 회전 · 휠 확대 · Shift 드래그 이동</span><a id="drawing" hidden target="_blank" rel="noopener">현재 뷰 SVG ↗</a></div></footer>
<script type="module" src="viewer.js"></script></body></html>
